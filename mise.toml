# Go のバージョンを固定する。
# go.mod は "go 1.26" としか書けず、mise はこれを読まない。
# この指定が無いと `go build` が
# 「No version is set for shim: go」で失敗する（実測: 2026-08-20）。
# **1.26.3 で標準ライブラリの脆弱性が13件直っている。**
# 1.26.2 のままだと、`html/template` の XSS と `net/http` の無限ループに到達する経路が
# 実際にある（`govulncheck ./...` で実測: 2026-08-23）。
[tools]
go = "1.26.7"
